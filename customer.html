<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seru!mahjong - Terminal Pemain</title>
    <!-- Font Futuristik -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19; --panel-bg: rgba(20, 30, 48, 0.7); --primary-neon: #00e5ff;
            --primary-dim: #0088aa; --primary-dark: #002233; --neon-purple: #b300ff;
            --neon-orange: #ff9900; --neon-red: #ff0055; --text-light: #e2e8f0; --text-muted: #94a3b8;
            --glow-strong: 0 0 15px rgba(0, 229, 255, 0.6); --glow-soft: 0 0 8px rgba(0, 229, 255, 0.3);
            --border-neon: 1px solid var(--primary-neon);
        }

        body { 
            font-family: 'Rajdhani', sans-serif; text-align: center; 
            background: radial-gradient(circle at top, #1a233a, var(--bg-dark)); 
            color: var(--text-light); padding: 15px; margin: 0; min-height: 100vh; overflow-x: hidden;
        }
        
        .header-section { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; max-width: 950px; margin: 0 auto 20px auto; padding: 30px 15px; border-radius: 15px; border: 1px solid rgba(0, 229, 255, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .header-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('/nogambling.png'); background-size: cover; background-position: center; opacity: 0.2; z-index: 0; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%); transition: opacity 0.5s ease; }
        .logo-center { position: relative; z-index: 1; height: 90px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.4)); transition: transform 0.3s ease; }
        
        .center-timer { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle, rgba(11,15,25,0.85) 40%, transparent 80%); padding: 15px 50px; border-radius: 50%; width: 100%; max-width: 500px; }
        h2#judulMeja { margin: 0; color: var(--primary-neon); font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase; text-shadow: var(--glow-strong); }
        .status { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; margin-top: 5px; text-transform: uppercase; }
        .timer-box { font-size: 5rem; font-weight: 700; color: var(--primary-neon); margin: 5px 0; text-shadow: 0 0 20px rgba(0, 229, 255, 0.8); font-variant-numeric: tabular-nums; }
        .time-info { margin-top: 5px; font-size: 1.1rem; color: var(--primary-neon); background: var(--primary-dark); padding: 5px 20px; border-radius: 20px; display: inline-block; border: 1px solid var(--primary-dim); box-shadow: var(--glow-soft); }
        
        .btn-manual { background: transparent; color: var(--primary-neon); border: var(--border-neon); padding: 10px 20px; border-radius: 5px; font-weight: 700; cursor: pointer; margin-top: 5px; margin-bottom: 5px; width: 100%; max-width: 350px; font-size: 1.1rem; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2); position: relative; z-index: 2; }
        .btn-manual:hover { background: var(--primary-neon); color: #000; box-shadow: var(--glow-strong); }
        .btn-call-staff { background: rgba(255, 0, 85, 0.15); color: var(--neon-red); border: 1px solid var(--neon-red); box-shadow: inset 0 0 10px rgba(255, 0, 85, 0.2); }
        .btn-call-staff:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.8); }

        .dashboard-layout { display: flex; flex-wrap: wrap; gap: 20px; max-width: 950px; margin: 15px auto; justify-content: center; position: relative; z-index: 2; }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; flex: 1; min-width: 320px; border: 1px solid var(--primary-dim); box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05); backdrop-filter: blur(10px); }
        .panel h3 { margin-top: 0; color: #fff; border-bottom: 1px solid var(--primary-dim); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px var(--primary-neon); }
        
        .control-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 10px 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(0, 229, 255, 0.2); transition: 0.3s; }
        .player-name { flex: 1; background: transparent; border: none; color: var(--primary-neon); font-size: 1.2rem; font-weight: 700; border-bottom: 1px dashed var(--primary-dim); margin-right: 15px; max-width: 120px; font-family: 'Rajdhani', sans-serif; }
        .player-name:focus { outline: none; border-bottom-style: solid; }
        .score-display { font-size: 1.8rem; font-weight: 700; color: #fff; width: 40px; text-align: center; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .btn-group { display: flex; gap: 8px; margin-left: 10px; }
        .score-btn { padding: 5px 15px; font-size: 1rem; cursor: pointer; border: none; border-radius: 4px; font-weight: 700; color: #000; font-family: 'Rajdhani', sans-serif; transition: 0.2s; }
        .btn-minus { background: #64748b; color: white; }
        .btn-plus { background: var(--primary-neon); box-shadow: 0 0 8px rgba(0, 255, 163, 0.6); }

        .podium-container { display: flex; justify-content: center; align-items: flex-end; height: 220px; gap: 8px; margin-top: 30px; }
        .step { display: flex; flex-direction: column; align-items: center; width: 23%; }
        .step-name { font-size: 1rem; margin-bottom: 10px; color: var(--text-light); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .step-bar { width: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; color: #000; border-radius: 6px 6px 0 0; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .step-bar::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 10px 10px; pointer-events: none; opacity: 0.3; }
        .rank-2 .step-bar { height: 130px; background: linear-gradient(to top, #7a00cc, var(--neon-purple)); color: white; } 
        .rank-1 .step-bar { height: 180px; background: linear-gradient(to top, var(--primary-dim), var(--primary-neon)); box-shadow: 0 0 20px rgba(0, 229, 255, 0.8); z-index: 2;} 
        .rank-3 .step-bar { height: 90px; background: linear-gradient(to top, #cc7a00, var(--neon-orange)); color: white; } 
        .rank-4 .step-bar { height: 50px; background: linear-gradient(to top, #1e293b, #334155); color: var(--text-light); } 
        .rank-badge { font-size: 0.9rem; margin-top: 8px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--bg-dark); border: 1px solid var(--primary-neon); margin: 3% auto; padding: 20px; border-radius: 12px; width: 95%; max-width: 600px; text-align: center; position: relative; box-shadow: var(--glow-strong); max-height: 90vh; overflow-y: auto; }
        
        .tab-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--text-dim); padding: 8px 20px; border-radius: 5px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-neon); color: #000; border-color: var(--primary-neon); box-shadow: var(--glow-strong); }
        
        .tab-content { display: none; }
        .tab-content img { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); object-fit: contain; }

        .slider-container { position: relative; width: 100%; overflow: hidden; border-radius: 8px; border: 1px solid var(--primary-dim); }
        .slides { display: flex; transition: transform 0.4s ease-in-out; }
        .slide { min-width: 100%; box-sizing: border-box; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: var(--primary-neon); border: 1px solid var(--primary-neon); font-size: 20px; cursor: pointer; padding: 12px 15px; border-radius: 5px; z-index: 10; transition: 0.3s; }
        .slider-btn:hover { background: var(--primary-neon); color: black; }
        .prev { left: 10px; } .next { right: 10px; }
        
        .dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px;}
        .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary-dark); border: 1px solid var(--primary-dim); cursor: pointer; transition: 0.3s;}
        .dot.active { background: var(--primary-neon); box-shadow: var(--glow-strong); }
        
        .close-btn { position: absolute; top: 15px; right: 15px; background: #000; color: var(--primary-neon); border: 1px solid var(--primary-neon); width: 35px; height: 35px; line-height: 33px; border-radius: 50%; font-size: 22px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; z-index: 10; }
        
        #loginOverlay { display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: var(--panel-bg); padding: 40px; border-radius: 15px; border: 1px solid var(--primary-neon); box-shadow: var(--glow-strong); width: 90%; max-width: 400px; text-align: center; }
        .login-box h2 { color: var(--primary-neon); margin-top: 0; font-size: 2rem; }
        .login-box p { color: var(--text-muted); margin-bottom: 25px; }
        .login-input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid var(--primary-dim); color: #fff; padding: 12px; margin-bottom: 15px; border-radius: 5px; font-size: 1.1rem; font-family: 'Rajdhani', sans-serif; text-align: center; }
        .login-input:focus { outline: none; border-color: var(--primary-neon); box-shadow: var(--glow-soft); }
        .btn-login { width: 100%; background: var(--primary-neon); color: #000; border: none; padding: 12px; font-size: 1.2rem; font-weight: bold; font-family: 'Rajdhani', sans-serif; border-radius: 5px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #00b8cc; box-shadow: var(--glow-strong); }

        @media (max-width: 768px) { .dashboard-layout { flex-direction: column; } .timer-box { font-size: 4rem; } .center-timer { padding: 15px; } }
    </style>
</head>
<body>

    <!-- POP-UP REGISTRASI WAJIB -->
    <div id="loginOverlay" class="modal" style="display: flex; z-index: 999; background: var(--bg-dark);">
        <div class="login-box">
            <h2>SELAMAT DATANG!</h2>
            <p>Silakan isi Nama & WhatsApp untuk mengakses meja ini.</p>
            <input type="text" id="custName" class="login-input" placeholder="Nama Lengkap" required>
            <input type="number" id="custWa" class="login-input" placeholder="Nomor WhatsApp" required>
            <button class="btn-login" onclick="submitLogin()">MASUK & MENUNGGU KASIR</button>
        </div>
    </div>

    <div id="mainDashboard">
        <div class="header-section">
            <div class="header-bg"></div>
            <img src="/logo.png" alt="Seru!mahjong Logo" class="logo-center">
            <div class="center-timer">
                <h2 id="judulMeja">TERMINAL --</h2>
                <div class="status" id="statusText">MENUNGGU REGISTRASI...</div>
                <div class="timer-box" id="timerDisplay">00:00:00</div>
                <div class="time-info" id="timeInfo" style="display: none;">
                    START: <span id="jamMulai">--:--</span> &nbsp;//&nbsp; END: <span id="jamSelesai">--:--</span>
                </div>
            </div>
        </div>
        
        <button class="btn-manual" onclick="bukaManual()">[ RULES & TUTORIAL ]</button>
        <button class="btn-manual btn-call-staff" onclick="panggilStaf()">🚨 PANGGIL STAF / BANTUAN</button>

        <div class="dashboard-layout">
            <div class="panel">
                <h3>LOG KEMENANGAN</h3>
                <div class="control-row"><input type="text" class="player-name" id="name1" value="Pemain 1" onchange="kirimSkor()"><div class="score-display" id="win1">0</div><div class="btn-group"><button class="score-btn btn-minus" onclick="ubahMenang(1, -1)">-1</button><button class="score-btn btn-plus" onclick="ubahMenang(1, 1)">+1</button></div></div>
                <div class="control-row"><input type="text" class="player-name" id="name2" value="Pemain 2" onchange="kirimSkor()"><div class="score-display" id="win2">0</div><div class="btn-group"><button class="score-btn btn-minus" onclick="ubahMenang(2, -1)">-1</button><button class="score-btn btn-plus" onclick="ubahMenang(2, 1)">+1</button></div></div>
                <div class="control-row"><input type="text" class="player-name" id="name3" value="Pemain 3" onchange="kirimSkor()"><div class="score-display" id="win3">0</div><div class="btn-group"><button class="score-btn btn-minus" onclick="ubahMenang(3, -1)">-1</button><button class="score-btn btn-plus" onclick="ubahMenang(3, 1)">+1</button></div></div>
                <div class="control-row"><input type="text" class="player-name" id="name4" value="Pemain 4" onchange="kirimSkor()"><div class="score-display" id="win4">0</div><div class="btn-group"><button class="score-btn btn-minus" onclick="ubahMenang(4, -1)">-1</button><button class="score-btn btn-plus" onclick="ubahMenang(4, 1)">+1</button></div></div>
            </div>
            <div class="panel">
                <h3>LIVE LEADERBOARD</h3>
                <div class="podium-container">
                    <div class="step rank-2"><div class="step-name" id="podium-name-2">Pemain 2</div><div class="step-bar" id="podium-score-2">0</div><div class="rank-badge">RANK 02</div></div>
                    <div class="step rank-1"><div class="step-name" id="podium-name-1">Pemain 1</div><div class="step-bar" id="podium-score-1">0</div><div class="rank-badge">RANK 01</div></div>
                    <div class="step rank-3"><div class="step-name" id="podium-name-3">Pemain 3</div><div class="step-bar" id="podium-score-3">0</div><div class="rank-badge">RANK 03</div></div>
                    <div class="step rank-4"><div class="step-name" id="podium-name-4">Pemain 4</div><div class="step-bar" id="podium-score-4">0</div><div class="rank-badge">RANK 04</div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="manualModal" class="modal">
        <div class="modal-content">
            <div class="close-btn" onclick="tutupManual()">&times;</div>
            <h3 style="color: var(--primary-neon); margin-top: 0; margin-bottom: 15px; text-shadow: var(--glow-strong);">PUSAT INFORMASI</h3>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="bukaTab('tabHarga', this)">HARGA</button>
                <button class="tab-btn" onclick="bukaTab('tabRules', this)">RULES</button>
                <button class="tab-btn" onclick="bukaTab('tabGuide', this)">GUIDE</button>
            </div>

            <div id="tabHarga" class="tab-content" style="display: block;"><img src="/harga.jpg" alt="Daftar Harga"></div>

            <div id="tabRules" class="tab-content">
                <div class="slider-container">
                    <div class="slides" id="slideTrackRules">
                        <div class="slide"><img src="/rules.jpeg" alt="Rules 1"></div>
                        <div class="slide"><img src="/rules2.jpeg" alt="Rules 2" onerror="this.src='/rules.jpeg'"></div>
                    </div>
                    <button class="slider-btn prev" onclick="geserSlideRules(-1)">&#10094;</button>
                    <button class="slider-btn next" onclick="geserSlideRules(1)">&#10095;</button>
                </div>
                <div class="dots" id="dotContainerRules"><div class="dot active" onclick="lompatSlideRules(0)"></div><div class="dot" onclick="lompatSlideRules(1)"></div></div>
            </div>

            <div id="tabGuide" class="tab-content">
                <div class="slider-container">
                    <div class="slides" id="slideTrackGuide">
                        <div class="slide"><img src="/guide1.png" alt="Guide 1"></div>
                        <div class="slide"><img src="/guide2.jpg" alt="Guide 2"></div>
                        <div class="slide"><img src="/guide3.jpg" alt="Guide 3"></div>
                        <div class="slide"><img src="/guide4.jpg" alt="Guide 4"></div>
                    </div>
                    <button class="slider-btn prev" onclick="geserSlideGuide(-1)">&#10094;</button>
                    <button class="slider-btn next" onclick="geserSlideGuide(1)">&#10095;</button>
                </div>
                <div class="dots" id="dotContainerGuide"><div class="dot active" onclick="lompatSlideGuide(0)"></div><div class="dot" onclick="lompatSlideGuide(1)"></div><div class="dot" onclick="lompatSlideGuide(2)"></div><div class="dot" onclick="lompatSlideGuide(3)"></div></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        function bukaTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        let currentSlideRules = 0; const totalSlidesRules = 2;
        function updateSliderRules() { document.getElementById('slideTrackRules').style.transform = `translateX(-${currentSlideRules * 100}%)`; document.querySelectorAll('#dotContainerRules .dot').forEach((dot, idx) => dot.classList.toggle('active', idx === currentSlideRules)); }
        function geserSlideRules(arah) { currentSlideRules += arah; if (currentSlideRules < 0) currentSlideRules = totalSlidesRules - 1; if (currentSlideRules >= totalSlidesRules) currentSlideRules = 0; updateSliderRules(); }
        function lompatSlideRules(index) { currentSlideRules = index; updateSliderRules(); }

        let currentSlideGuide = 0; const totalSlidesGuide = 4;
        function updateSliderGuide() { document.getElementById('slideTrackGuide').style.transform = `translateX(-${currentSlideGuide * 100}%)`; document.querySelectorAll('#dotContainerGuide .dot').forEach((dot, idx) => dot.classList.toggle('active', idx === currentSlideGuide)); }
        function geserSlideGuide(arah) { currentSlideGuide += arah; if (currentSlideGuide < 0) currentSlideGuide = totalSlidesGuide - 1; if (currentSlideGuide >= totalSlidesGuide) currentSlideGuide = 0; updateSliderGuide(); }
        function lompatSlideGuide(index) { currentSlideGuide = index; updateSliderGuide(); }

        const pathArray = window.location.pathname.split('/');
        const tableId = pathArray[pathArray.length - 1].toUpperCase(); 
        document.getElementById('judulMeja').innerText = "TERMINAL " + tableId;

        const socket = io();

        socket.on('connect', () => { socket.emit('join_table', tableId); });
        
        socket.on('timer_update', (sessionData) => {
            if (sessionData.status === 'completed') {
                document.getElementById('timerDisplay').innerText = "00:00:00";
                document.getElementById('statusText').innerText = "MENUNGGU REGISTRASI...";
                document.getElementById('statusText').style.color = "var(--text-muted)";
                document.getElementById('timeInfo').style.display = "none";
                document.getElementById('loginOverlay').style.display = "flex"; // Wajibkan isi data lagi jika sesi selesai
                for(let i=1; i<=4; i++) { document.getElementById(`win${i}`).innerText = "0"; }
                updatePodium(); 
            } 
            else if (sessionData.status === 'waiting') {
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('statusText').innerText = "MENUNGGU APPROVAL KASIR...";
                document.getElementById('statusText').style.color = "var(--neon-orange)";
            }
            else if (sessionData.status === 'active') {
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('statusText').innerText = "SISTEM AKTIF";
                document.getElementById('statusText').style.color = "var(--primary-neon)";
                const formatWaktu = (t) => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if(sessionData.startTime) document.getElementById('jamMulai').innerText = formatWaktu(sessionData.startTime);
                document.getElementById('jamSelesai').innerText = formatWaktu(sessionData.endTime);
                document.getElementById('timeInfo').style.display = "inline-block";
            }
        });

        function submitLogin() {
            const name = document.getElementById('custName').value.trim();
            const wa = document.getElementById('custWa').value.trim();
            if(!name || !wa) return alert("Harap isi Nama dan Nomor WhatsApp!");
            socket.emit('submit_login', { table_id: tableId, name: name, wa: wa });
        }

        function panggilStaf() {
            const namaPemain = document.getElementById('name1').value || "Pelanggan";
            socket.emit('call_staff', { table_id: tableId, customer_name: namaPemain });
            alert("🚨 Panggilan berhasil dikirim ke kasir!");
        }

        socket.on('sync_timer_display', (timeString) => {
            document.getElementById('timerDisplay').innerText = timeString;
            if(timeString === "00:00:00") {
                document.getElementById('statusText').innerText = "WAKTU HABIS!";
                document.getElementById('statusText').style.color = "#ff0055";
            }
        });

        function updatePodium() {
            let players = [
                { name: document.getElementById('name1').value || "Pemain 1", win: parseInt(document.getElementById('win1').innerText) },
                { name: document.getElementById('name2').value || "Pemain 2", win: parseInt(document.getElementById('win2').innerText) },
                { name: document.getElementById('name3').value || "Pemain 3", win: parseInt(document.getElementById('win3').innerText) },
                { name: document.getElementById('name4').value || "Pemain 4", win: parseInt(document.getElementById('win4').innerText) }
            ];
            players.sort((a, b) => b.win - a.win);
            for (let i = 0; i < 4; i++) {
                let rank = i + 1;
                document.getElementById(`podium-name-${rank}`).innerText = players[i].name;
                document.getElementById(`podium-score-${rank}`).innerText = players[i].win;
            }
        }
        updatePodium();

        function ubahMenang(playerNumber, amount) {
            let winElement = document.getElementById(`win${playerNumber}`);
            let currentWin = parseInt(winElement.innerText);
            let newWin = currentWin + amount;
            if (newWin < 0) newWin = 0; 
            winElement.innerText = newWin; kirimSkor(); updatePodium(); 
        }

        function kirimSkor() {
            let dataSkor = {
                n1: document.getElementById('name1').value, w1: document.getElementById('win1').innerText,
                n2: document.getElementById('name2').value, w2: document.getElementById('win2').innerText,
                n3: document.getElementById('name3').value, w3: document.getElementById('win3').innerText,
                n4: document.getElementById('name4').value, w4: document.getElementById('win4').innerText,
            };
            socket.emit('update_score', { table_id: tableId, scores: dataSkor });
            updatePodium(); 
        }

        socket.on('sync_score', (dataSkor) => {
            document.getElementById('name1').value = dataSkor.n1; document.getElementById('win1').innerText = dataSkor.w1;
            document.getElementById('name2').value = dataSkor.n2; document.getElementById('win2').innerText = dataSkor.w2;
            document.getElementById('name3').value = dataSkor.n3; document.getElementById('win3').innerText = dataSkor.w3;
            document.getElementById('name4').value = dataSkor.n4; document.getElementById('win4').innerText = dataSkor.w4;
            updatePodium(); 
        });

        const modal = document.getElementById("manualModal");
        function bukaManual() { 
            modal.style.display = "block"; 
            bukaTab('tabHarga', document.querySelector('.tab-btn')); 
            currentSlideRules = 0; updateSliderRules(); 
            currentSlideGuide = 0; updateSliderGuide(); 
        }
        function tutupManual() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) tutupManual(); }
    </script>
</body>
</html>
