<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kasir - Seru! Mahjong</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap'); 

        :root {
            --bg-color: #0b0f19; --card-bg: rgba(20, 30, 48, 0.7); --card-border: rgba(0, 229, 255, 0.2);
            --neon-cyan: #00e5ff; --neon-purple: #b300ff; --neon-green: #00ff66; --neon-orange: #ff9900; --neon-red: #ff0055;
            --text-main: #e2e8f0; --text-dim: #94a3b8;
            --sidebar-width: 280px;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: radial-gradient(circle at top, #1a233a, var(--bg-color)); 
            color: var(--text-main); 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* SIDEBAR PUSH DRAWER */
        .sidebar {
            position: fixed;
            top: 0;
            left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width);
            height: 100%;
            background: #0f172a;
            border-right: 1px solid var(--neon-cyan);
            box-shadow: 10px 0 25px rgba(0,0,0,0.7);
            transition: left 0.3s ease-in-out;
            z-index: 1000;
            padding: 25px 20px;
            box-sizing: border-box;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .sidebar-title {
            color: var(--neon-cyan);
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sidebar-close-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .sidebar-close-btn:hover { color: var(--neon-red); }

        .sidebar-menu-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
        }

        .sidebar-menu-btn:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
            transform: translateX(4px);
        }

        /* MAIN CONTENT WRAPPER DENGAN FITUR PUSH (DORONG) */
        .main-wrapper {
            transition: margin-left 0.3s ease-in-out;
            padding: 20px 30px;
        }

        .main-wrapper.shifted {
            margin-left: var(--sidebar-width);
        }

        .header-container { 
            display: flex; 
            align-items: center; 
            gap: 20px;
            border-bottom: 1px solid var(--card-border); 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }

        .menu-toggle-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .menu-toggle-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .header-title { 
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--neon-cyan); 
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); 
            margin: 0; 
        }

        .section-title { 
            font-size: 1.2rem; 
            color: var(--text-dim); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 15px; 
            margin-top: 25px; 
            border-left: 3px solid var(--neon-purple); 
            padding-left: 10px; 
        }
        .section-title.manual { border-left-color: var(--neon-orange); }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 18px; 
        }
        
        .table-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px); 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            padding: 16px; 
            text-align: center; 
            position: relative; 
            transition: all 0.3s ease; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); 
        }
        .table-card:hover { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.5); 
        }

        .badge { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            font-size: 0.7rem; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-weight: 700; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
        }
        .badge-auto { background: rgba(179, 0, 255, 0.2); color: var(--neon-purple); border: 1px solid var(--neon-purple); }
        .badge-manual { background: rgba(255, 153, 0, 0.2); color: var(--neon-orange); border: 1px solid var(--neon-orange); }

        .table-title { font-size: 1.5rem; font-weight: 700; margin: 12px 0 4px 0; color: #fff; }

        /* TAMPILAN NAMA & NO WA CUSTOMER */
        .customer-info-box {
            min-height: 22px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--neon-green);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .table-status { font-size: 0.95rem; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
        .table-timer { 
            font-size: 2.4rem; 
            font-weight: 700; 
            color: var(--neon-cyan); 
            margin-bottom: 12px; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); 
            transition: 0.3s; 
        }
        
        .warning-label { 
            display: none; 
            background: rgba(255, 153, 0, 0.2); 
            color: var(--neon-orange); 
            border: 1px solid var(--neon-orange); 
            padding: 5px; 
            border-radius: 5px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
            animation: blink 1.5s infinite; 
        }
        
        .table-card.help-active { border: 2px solid var(--neon-red) !important; animation: emergencyBlink 0.8s infinite alternate; }
        .help-banner { display: none; background: var(--neon-red); color: white; padding: 6px; border-radius: 5px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        @keyframes emergencyBlink { from { box-shadow: 0 0 5px var(--neon-red); } to { box-shadow: 0 0 25px var(--neon-red); } }

        .status-kosong { border-top: 3px solid #334155; }
        .status-menunggu { border-top: 3px solid var(--neon-orange); box-shadow: inset 0px 10px 20px -10px var(--neon-orange); }
        .status-aktif { border-top: 3px solid var(--neon-green); box-shadow: inset 0px 10px 20px -10px var(--neon-green); }

        .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .action-btns button { padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: 700; font-size: 0.85rem; width: 100%; font-family: 'Rajdhani', sans-serif; transition: 0.2s; text-transform: uppercase; }
        .btn-start { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); flex: 1; }
        .btn-start:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 10px var(--neon-cyan); }
        .btn-extend { background: rgba(255, 153, 0, 0.1); color: var(--neon-orange); border: 1px solid var(--neon-orange); flex: 1; }
        .btn-extend:hover { background: var(--neon-orange); color: #000; box-shadow: 0 0 10px var(--neon-orange); }
        .btn-checkout { background: rgba(255, 0, 85, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red); display: none; }
        .btn-checkout:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 10px var(--neon-red); }

        /* MODAL POPUPS */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-color); border: 1px solid var(--neon-cyan); margin: 3% auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { color: var(--neon-cyan); font-size: 25px; cursor: pointer; }
        
        .admin-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .admin-form select, .admin-form input { background: #1e293b; color: white; border: 1px solid var(--text-dim); padding: 8px; border-radius: 5px; font-family: 'Rajdhani'; flex: 1; text-transform: uppercase; }
        .admin-form button { background: var(--neon-green); color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .table-list { max-height: 300px; overflow-y: auto; }
        .table-item { display: flex; justify-content: space-between; background: #1e293b; padding: 10px; margin-bottom: 8px; border-radius: 5px; }
        .btn-del { background: var(--neon-red); color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }

        .report-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; text-align: left; }
        .report-table th, .report-table td { padding: 10px; border-bottom: 1px solid var(--card-border); }
        .report-table th { color: var(--neon-cyan); background: rgba(0, 229, 255, 0.05); }
        .status-badge-active { background: rgba(0, 255, 102, 0.2); color: var(--neon-green); padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .status-badge-done { background: rgba(148, 163, 184, 0.2); color: var(--text-dim); padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }

        .receipt-paper { background: #fdfdfd; color: #111; font-family: 'Courier Prime', monospace; padding: 30px 20px; max-width: 350px; border-radius: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: left; position: relative; }
        .receipt-paper::after { content: ""; position: absolute; bottom: -8px; left: 0; right: 0; height: 10px; background-image: radial-gradient(circle at 10px 0, transparent 10px, #fdfdfd 11px); background-size: 20px 20px; background-repeat: repeat-x; }
        .dash-line { border-bottom: 1px dashed #333; margin: 10px 0; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 5px;}
        
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { color: var(--text-dim); display: block; margin-bottom: 5px; font-size: 1rem; }
        .input-group input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid var(--text-dim); color: #fff; padding: 12px; border-radius: 5px; font-size: 1.1rem; font-family: 'Rajdhani'; }
        .subtotal-display { font-size: 1.5rem; color: var(--neon-green); font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 5px var(--neon-green); }
    </style>
</head>
<body>

    <!-- SIDEBAR PUSH -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3 class="sidebar-title">NAVIGASI</h3>
            <button class="sidebar-close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <button class="sidebar-menu-btn" onclick="bukaModalLaporan()">
            <span>📊</span> Laporan Transaksi
        </button>
        <button class="sidebar-menu-btn" onclick="bukaModalAdmin()">
            <span>⚙</span> Manajemen Meja
        </button>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div id="mainWrapper" class="main-wrapper">
        <div class="header-container">
            <button class="menu-toggle-btn" onclick="toggleSidebar()">
                <span>☰</span> MENU KASIR
            </button>
            <h1 class="header-title">SYSTEM_CORE // KASIR</h1>
        </div>

        <div class="section-title">Terminal Automatic</div>
        <div class="grid-container" id="mejaAutoContainer"></div>

        <div class="section-title manual">Terminal Manual</div>
        <div class="grid-container" id="mejaManualContainer"></div>
    </div>

    <!-- MODAL LAPORAN TRANSAKSI -->
    <div id="reportModal" class="modal">
        <div class="modal-content" style="max-width: 850px; width: 95%;">
            <div class="modal-header">
                <h2 style="margin:0; color:var(--neon-green);">📊 LAPORAN DATA TRANSAKSI & BOOKING</h2>
                <span class="close-btn" onclick="document.getElementById('reportModal').style.display='none'">&times;</span>
            </div>
            <div style="max-height: 450px; overflow-y: auto;">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Meja</th><th>Pelanggan</th><th>Mulai</th><th>Selesai</th><th>Status</th><th>Total Tagihan</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL MANAJEMEN MEJA -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin:0; color:var(--neon-cyan);">Konfigurasi Meja</h2>
                <span class="close-btn" onclick="tutupModalAdmin()">&times;</span>
            </div>
            <div class="admin-form">
                <input type="text" id="newTableId" placeholder="Kode (Cth: A3, M5)" required>
                <select id="newTableType">
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                </select>
                <button onclick="tambahMeja()">+ TAMBAH</button>
            </div>
            <div class="table-list" id="adminTableList"></div>
        </div>
    </div>

    <!-- MODAL CHECKOUT -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2 style="margin:0; color:var(--neon-orange);">BILLING MEJA <span id="checkoutTableId"></span></h2>
                <span class="close-btn" onclick="document.getElementById('checkoutModal').style.display='none'">&times;</span>
            </div>
            <div class="input-group">
                <label>Subtotal (Terhitung Otomatis):</label>
                <div class="subtotal-display" id="displaySubtotal">Rp 0</div>
            </div>
            <div class="input-group">
                <label>Diskon / Potongan Harga (Rp):</label>
                <input type="number" id="inputDiskon" value="0">
            </div>
            <button class="btn-start" style="width: 100%; padding: 15px; font-size: 1.2rem; background: var(--neon-orange); color: black; border:none; margin-top: 10px;" onclick="prosesCheckout()">💳 PROSES & CETAK STRUK</button>
        </div>
    </div>

    <!-- MODAL STRUK -->
    <div id="receiptModal" class="modal">
        <div class="modal-content receipt-paper" style="margin: 5% auto;">
            <div style="text-align: center; margin-bottom: 15px;">
                <h2 style="margin:0; font-weight: bold; font-size: 1.5rem;">SERU! MAHJONG</h2>
                <p style="margin:0; font-size: 0.9rem;">Tanya Social House</p>
                <div class="dash-line"></div>
            </div>
            <div id="receiptContent"></div>
            <div style="text-align: center; margin-top: 15px;">
                <div class="dash-line"></div>
                <p style="margin: 5px 0; font-size: 0.9rem;">Lunas. Terima Kasih!</p>
                <p style="margin: 0; font-size: 0.8rem; color: #555;">(Invoice juga telah dikirim ke WA)</p>
                <button onclick="document.getElementById('receiptModal').style.display='none'" style="margin-top: 20px; padding: 10px; background: #111; color: #fff; border: none; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; font-family: 'Rajdhani'; font-size: 1.1rem;">TUTUP</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const liveTimers = {}; 
        const sessionDataMap = {}; 
        let currentCheckoutTable = '';

        const defaultTables = [
            { id: 'A1', type: 'Automatic' }, { id: 'A2', type: 'Automatic' },
            { id: 'M1', type: 'Manual' }, { id: 'M2', type: 'Manual' },
            { id: 'M3', type: 'Manual' }, { id: 'M4', type: 'Manual' }
        ];

        let tableConfig = JSON.parse(localStorage.getItem('mahjongTables_v2')) || defaultTables;
        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const wrapper = document.getElementById('mainWrapper');
            sidebar.classList.toggle('active');
            wrapper.classList.toggle('shifted');
        }

        function renderMeja() {
            const containerAuto = document.getElementById('mejaAutoContainer');
            const containerManual = document.getElementById('mejaManualContainer');
            const adminList = document.getElementById('adminTableList');
            
            containerAuto.innerHTML = ''; containerManual.innerHTML = ''; adminList.innerHTML = '';
            tableConfig.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true, sensitivity: 'base'}));

            tableConfig.forEach(table => {
                const html = createTableHTML(table.id, table.type);
                if (table.type === 'Automatic') containerAuto.innerHTML += html;
                else containerManual.innerHTML += html;

                adminList.innerHTML += `
                    <div class="table-item">
                        <span>MEJA ${table.id} (${table.type})</span>
                        <button class="btn-del" onclick="hapusMeja('${table.id}')">Hapus</button>
                    </div>
                `;
            });
        }

        function createTableHTML(id, type) {
            const badgeClass = type === 'Automatic' ? 'badge-auto' : 'badge-manual';
            return `
                <div class="table-card status-kosong" id="card-${id}">
                    <div class="badge ${badgeClass}">${type}</div>
                    <div class="table-title">MEJA ${id}</div>
                    <div class="customer-info-box" id="cust-${id}"></div>
                    <div class="help-banner" id="help-banner-${id}">🚨 PANGGILAN STAF!</div>
                    <div class="table-status" id="status-${id}">⚪ OFFLINE</div>
                    <div class="warning-label" id="warning-${id}">⚠ SISA 15 MNT - Tawarkan Extend</div>
                    <div class="table-timer" id="timer-${id}" style="display:none;">00:00:00</div>
                    
                    <div class="action-btns">
                        <div class="btn-row" id="approval-group-${id}" style="display:none;">
                            <button class="btn-start" style="background:var(--neon-orange); color:black;" onclick="approveMeja('${id}', 60)">APPROVE 1 JAM</button>
                            <button class="btn-start" style="background:var(--neon-orange); color:black;" onclick="approveMeja('${id}', 180)">APPROVE 3 JAM</button>
                        </div>
                        <div class="btn-row" id="start-group-${id}">
                            <button class="btn-start" disabled style="opacity:0.5;">MENUNGGU SCAN QR</button>
                        </div>
                        <div class="btn-row" id="extend-group-${id}" style="display:none;">
                            <button class="btn-extend" onclick="tambahWaktu('${id}', 30)">+ 30 MNT</button>
                            <button class="btn-extend" onclick="tambahWaktu('${id}', 60)">+ 60 MNT</button>
                        </div>
                        <button class="btn-checkout" id="checkout-${id}" onclick="bukaModalCheckout('${id}')" style="display:none;">🛑 RESET & BILLING</button>
                    </div>
                </div>
            `;
        }

        renderMeja();

        const adminModal = document.getElementById("adminModal");
        function bukaModalAdmin() { adminModal.style.display = "block"; }
        function tutupModalAdmin() { adminModal.style.display = "none"; }
        
        function bukaModalLaporan() {
            fetch('/api/cashier/reports')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('reportTableBody');
                    tbody.innerHTML = '';
                    if (data.length === 0) tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Belum ada data.</td></tr>`;
                    data.forEach(row => {
                        const tglMulai = row.start_time ? new Date(row.start_time).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                        const tglSelesai = row.end_time ? new Date(row.end_time).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                        const statusBadge = row.status === 'active' ? `<span class="status-badge-active">ON PROGRESS</span>` : row.status === 'waiting' ? `<span style="color:var(--neon-orange);">MENUNGGU APPROVAL</span>` : `<span class="status-badge-done">COMPLETED</span>`;
                        const nominal = row.status === 'active' ? row.total_billed : row.grand_total;
                        tbody.innerHTML += `
                            <tr>
                                <td>#${row.id}</td><td><strong>${row.table_id}</strong></td>
                                <td>${row.customer_name || '-'} <br><small>${row.customer_wa || ''}</small></td>
                                <td>${tglMulai}</td><td>${tglSelesai}</td><td>${statusBadge}</td><td><strong>${formatRp(nominal)}</strong></td>
                            </tr>
                        `;
                    });
                    document.getElementById('reportModal').style.display = 'block';
                });
        }

        window.onclick = function(event) { 
            if (event.target == adminModal) tutupModalAdmin(); 
            if (event.target == document.getElementById('checkoutModal')) document.getElementById('checkoutModal').style.display='none';
            if (event.target == document.getElementById('receiptModal')) document.getElementById('receiptModal').style.display='none';
            if (event.target == document.getElementById('reportModal')) document.getElementById('reportModal').style.display='none';
        }

        function tambahMeja() {
            const id = document.getElementById('newTableId').value.trim().toUpperCase();
            const type = document.getElementById('newTableType').value;
            if(!id) return alert("Masukkan Kode Meja!");
            if(tableConfig.find(t => t.id === id)) return alert("Kode Meja sudah ada!");
            tableConfig.push({ id, type }); simpanDanRender(); document.getElementById('newTableId').value = '';
        }
        function hapusMeja(id) { if(confirm(`Yakin hapus MEJA ${id}?`)) { tableConfig = tableConfig.filter(t => t.id !== id); simpanDanRender(); } }
        function simpanDanRender() { localStorage.setItem('mahjongTables_v2', JSON.stringify(tableConfig)); renderMeja(); sinkronisasiStatusAwal(); }

        function sinkronisasiStatusAwal() {
            fetch('/api/tables/status').then(res => res.json()).then(data => {
                tableConfig.forEach(t => updateTampilanKasir({ table_id: t.id, status: 'completed' }));
                for (const tableId in data) {
                    if (document.getElementById(`card-${tableId}`)) updateTampilanKasir({ table_id: tableId, ...data[tableId] });
                }
            });
        }
        
        sinkronisasiStatusAwal();
        socket.on('connect', () => { sinkronisasiStatusAwal(); });

        socket.on('update_dashboard_kasir', (data) => {
            if (document.getElementById(`card-${data.table_id}`)) updateTampilanKasir(data);
        });

        socket.on('staff_alert', (data) => {
            const card = document.getElementById(`card-${data.table_id}`);
            const banner = document.getElementById(`help-banner-${data.table_id}`);
            if (card && banner) {
                card.classList.add('help-active');
                banner.style.display = 'block';
                banner.innerText = `🚨 ${data.customer_name} MEMANGGIL STAF!`;
                try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e) {}
            }
        });

        function updateTampilanKasir(data) {
            const card = document.getElementById(`card-${data.table_id}`);
            if(!card) return;
            const statusText = document.getElementById(`status-${data.table_id}`);
            const timerEl = document.getElementById(`timer-${data.table_id}`);
            const startGroup = document.getElementById(`start-group-${data.table_id}`);
            const approvalGroup = document.getElementById(`approval-group-${data.table_id}`);
            const extendGroup = document.getElementById(`extend-group-${data.table_id}`);
            const btnCheckout = document.getElementById(`checkout-${data.table_id}`);
            const custInfo = document.getElementById(`cust-${data.table_id}`);
            const warningEl = document.getElementById(`warning-${data.table_id}`);
            const banner = document.getElementById(`help-banner-${data.table_id}`);

            if (data.status === 'waiting') {
                card.className = "table-card status-menunggu";
                statusText.innerText = "🟡 MENUNGGU APPROVAL"; 
                statusText.style.color = "var(--neon-orange)";
                if (data.customerName) {
                    custInfo.innerText = `👤 ${data.customerName} (${data.customerWa || '-'})`;
                    custInfo.style.color = "var(--neon-orange)";
                }
                warningEl.style.display = "none";
                delete liveTimers[data.table_id]; 
                timerEl.style.display = "none";
                
                startGroup.style.display = "none";
                approvalGroup.style.display = "flex"; 
                extendGroup.style.display = "none";
                btnCheckout.style.display = "none";
            } 
            else if (data.status === 'active') {
                card.className = "table-card status-aktif";
                sessionDataMap[data.table_id] = data; 
                statusText.innerText = `🟢 AKTIF`; 
                statusText.style.color = "var(--neon-green)";
                if (data.customerName) {
                    custInfo.innerText = `👤 ${data.customerName} (${data.customerWa || '-'})`;
                    custInfo.style.color = "var(--neon-green)";
                }
                
                liveTimers[data.table_id] = new Date(data.endTime).getTime();
                timerEl.style.display = "block";

                startGroup.style.display = "none";
                approvalGroup.style.display = "none";
                extendGroup.style.display = "flex"; 
                btnCheckout.style.display = "block";
            }
            else if (data.status === 'completed') {
                card.className = "table-card status-kosong";
                statusText.innerText = "⚪ OFFLINE"; 
                statusText.style.color = "var(--text-dim)";
                custInfo.innerText = "";
                warningEl.style.display = "none";
                if(banner) { banner.style.display = 'none'; card.classList.remove('help-active'); }
                delete liveTimers[data.table_id]; 
                timerEl.style.display = "none";
                delete sessionDataMap[data.table_id];
                
                startGroup.style.display = "flex";
                approvalGroup.style.display = "none";
                extendGroup.style.display = "none"; 
                btnCheckout.style.display = "none";
            }
        }

        setInterval(() => {
            const now = new Date().getTime();
            for (const [id, endTime] of Object.entries(liveTimers)) {
                const distance = endTime - now;
                const timerEl = document.getElementById(`timer-${id}`);
                const warningEl = document.getElementById(`warning-${id}`);
                if (!timerEl) continue;

                let timeString = "00:00:00";
                if (distance <= 0) {
                    timerEl.style.color = "var(--neon-red)"; 
                    timerEl.style.textShadow = "0 0 15px rgba(255, 0, 85, 0.8)";
                    if(warningEl) warningEl.style.display = "none";
                } else {
                    if (distance <= 900000) {
                        timerEl.style.color = "var(--neon-orange)"; 
                        timerEl.style.textShadow = "0 0 15px rgba(255, 153, 0, 0.8)";
                        if(warningEl) warningEl.style.display = "block";
                    } else {
                        timerEl.style.color = "var(--neon-cyan)"; 
                        timerEl.style.textShadow = "0 0 10px rgba(0, 229, 255, 0.5)";
                        if(warningEl) warningEl.style.display = "none";
                    }
                    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((distance % (1000 * 60)) / 1000);
                    timeString = String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
                }
                timerEl.innerText = timeString;
                socket.emit('kasir_sync_tick', { table_id: id, time_text: timeString });
            }
        }, 1000);

        function approveMeja(tableId, durasi) {
            fetch('/api/cashier/approve', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ table_id: tableId, duration_minutes: durasi })
            });
        }

        function tambahWaktu(tableId, durasiTambahan) { 
            fetch('/api/cashier/extend', { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify({ table_id: tableId, added_minutes: durasiTambahan }) 
            }); 
        }
        
        function bukaModalCheckout(tableId) {
            const card = document.getElementById(`card-${tableId}`);
            const banner = document.getElementById(`help-banner-${tableId}`);
            if(card) card.classList.remove('help-active');
            if(banner) banner.style.display = 'none';

            currentCheckoutTable = tableId;
            const subtotal = sessionDataMap[tableId] ? sessionDataMap[tableId].totalBilled : 0;
            document.getElementById('checkoutTableId').innerText = tableId;
            document.getElementById('displaySubtotal').innerText = formatRp(subtotal);
            document.getElementById('inputDiskon').value = 0; 
            document.getElementById('checkoutModal').style.display = 'block';
        }

        function prosesCheckout() {
            const diskon = parseFloat(document.getElementById('inputDiskon').value) || 0;
            fetch('/api/cashier/checkout', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ table_id: currentCheckoutTable, diskon: diskon })
            })
            .then(res => res.json())
            .then(data => { 
                if (data.receipt) tampilkanStruk(data.receipt); 
                else alert(data.message || data.error); 
            });
        }

        function tampilkanStruk(r) {
            document.getElementById('checkoutModal').style.display = 'none';
            const formatWaktu = (dateStr) => new Date(dateStr).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const formatTanggal = (dateStr) => new Date(dateStr).toLocaleDateString('id-ID');

            const html = `
                <div class="receipt-row"><p style="margin:0;">No. Meja</p><p style="margin:0;"><strong>${r.table_id}</strong></p></div>
                <div class="receipt-row"><p style="margin:0;">Tanggal</p><p style="margin:0;">${formatTanggal(r.start_time)}</p></div>
                <div class="receipt-row"><p style="margin:0;">Nama</p><p style="margin:0;">${r.customer_name}</p></div>
                <div class="dash-line"></div>
                <div class="receipt-row"><p style="margin:0;">Check-In</p><p style="margin:0;">${formatWaktu(r.start_time)}</p></div>
                <div class="receipt-row"><p style="margin:0;">Check-Out</p><p style="margin:0;">${formatWaktu(r.end_time)}</p></div>
                <div class="dash-line"></div>
                <div class="receipt-row"><p style="margin:0;">Subtotal</p><p style="margin:0;">${formatRp(r.subtotal)}</p></div>
                <div class="receipt-row"><p style="margin:0;">Diskon</p><p style="margin:0;">-${formatRp(r.discount)}</p></div>
                <div class="dash-line"></div>
                <div class="receipt-row" style="margin-top: 10px;"><h3 style="margin:0; font-size:1.2rem;">TOTAL</h3><h3 style="margin:0; font-size:1.2rem;">${formatRp(r.grand_total)}</h3></div>
            `;
            document.getElementById('receiptContent').innerHTML = html;
            document.getElementById('receiptModal').style.display = 'block';
        }
    </script>
</body>
</html>
